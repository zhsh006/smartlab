# Local test instance on this computer. No production server data is mounted.
services:
  elabftw:
    environment:
      DISABLE_HTTPS: "false"
      SITE_URL: "https://localhost:3159"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --no-check-certificate --output-document=- https://127.0.0.1:8080/login.php | grep -q 'name=.password.'
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 6
