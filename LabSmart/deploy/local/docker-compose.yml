name: smartlab-v4-elabftw

services:
  mysql:
    image: mysql:8.4
    container_name: smartlab-v4-elabftw-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${ELABFTW_DB_PORT}:3306"
    volumes:
      - ../../.local/elabftw/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  elabftw:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    container_name: smartlab-v4-elabftw
    user: "101:101"
    read_only: true
    tmpfs:
      - /run:mode=755,uid=101,gid=101,exec,nosuid,nodev,size=64m
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${ELABFTW_PORT}:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: "${MYSQL_DATABASE}"
      DB_USER: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      SECRET_KEY: "${ELABFTW_SECRET_KEY}"
      SITE_URL: "${ELABFTW_SITE_URL}"
      SERVER_NAME: "${ELABFTW_SERVER_NAME}"
      DISABLE_HTTPS: "false"
      AUTO_DB_UPDATE: "true"
      PHP_TIMEZONE: "${ELABFTW_TIMEZONE}"
      SMARTLAB_IMAGEJ_URL: "${SMARTLAB_IMAGEJ_INTERNAL_URL}"
      TLS_CERT_PATH: "/certs/cert.pem"
      TLS_KEY_PATH: "/certs/key.pem"
    volumes:
      - ../../.local/elabftw/uploads:/elabftw/uploads
      - ../../.local/elabftw/uploads:/var/lib/elabftw/uploads
      - ../../.local/elabftw/cache:/var/cache/elabftw
      - ../../.local/elabftw/cache:/elabftw/cache
      - ../../.local/elabftw/exports:/elabftw/exports
      - ../../.local/elabftw/exports:/var/lib/elabftw/exports
      - ../../.local/elabftw/agent-inbox:/elabftw/agent-inbox
      - ../../.local/certs:/certs:ro

  imagej-worker:
    profiles:
      - imagej
    build:
      context: ../..
      dockerfile: deploy/imagej-worker/Dockerfile
    container_name: smartlab-v4-imagej-worker
    restart: unless-stopped
    environment:
      SMARTLAB_IMAGEJ_PORT: "${SMARTLAB_IMAGEJ_PORT}"
    ports:
      - "${SMARTLAB_IMAGEJ_HOST_PORT}:${SMARTLAB_IMAGEJ_PORT}"
    volumes:
      - ../../.local/imagej/plugins:/opt/Fiji/plugins/SmartLab
      - ../../.local/imagej/macros:/opt/Fiji/macros/SmartLab
      - ../../.local/imagej/data:/work/data
