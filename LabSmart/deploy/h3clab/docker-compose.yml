name: smartlab-workbench

services:
  mysql:
    image: mysql@sha256:6e54d72c66fb55fa2bba384cba8c7c0ea9d629fb4d2af613b0eef98d19c6df15
    container_name: smartlab-workbench-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 36

  elabftw:
    image: smartlab-workbench:20261015
    build:
      context: ../..
      dockerfile: deploy/h3clab/Dockerfile
    container_name: smartlab-workbench-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${ELABFTW_BIND:-0.0.0.0}:${ELABFTW_PORT:-3159}:443"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: "${MYSQL_DATABASE}"
      DB_USER: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      SECRET_KEY: "${ELABFTW_SECRET_KEY}"
      SITE_URL: "${ELABFTW_SITE_URL}"
      DISABLE_HTTPS: "false"
      AUTO_DB_UPDATE: "false"
      PHP_TIMEZONE: "Asia/Shanghai"
      TLS_CERT_PATH: "/certs/cert.pem"
      TLS_KEY_PATH: "/certs/key.pem"
    volumes:
      - ../../runtime/uploads:/elabftw/uploads
      - ../../runtime/uploads:/var/lib/elabftw/uploads
      - ../../runtime/cache:/var/cache/elabftw
      - ../../runtime/cache:/elabftw/cache
      - ../../runtime/exports:/elabftw/exports
      - ../../runtime/exports:/var/lib/elabftw/exports
      - ../../runtime/agent-inbox:/elabftw/agent-inbox
      - ../../runtime/certs:/certs:ro
      - ../../runtime/certs/cert.pem:/etc/nginx/certs/server.crt:ro
      - ../../runtime/certs/key.pem:/etc/nginx/certs/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/login.php | grep -qE '^(200|302)$'"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

volumes:
  mysql-data:
