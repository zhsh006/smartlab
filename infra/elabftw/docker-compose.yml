name: smartlab-v3-elabftw

services:
  mysql:
    image: mysql:8.4
    container_name: smartlab-v3-elabftw-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${ELABFTW_DB_PORT}:3306"
    volumes:
      - /home/r730lab/smartlab-v3/.local/elabftw/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  elabftw:
    build:
      context: /home/r730lab/smartlab-v3
      dockerfile: infra/elabftw/Dockerfile.smartlab
    container_name: smartlab-v3-elabftw
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${ELABFTW_PORT}:443"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: "${MYSQL_DATABASE}"
      DB_USER: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      SECRET_KEY: "${ELABFTW_SECRET_KEY}"
      SITE_URL: "${ELABFTW_SITE_URL}"
      SERVER_NAME: "${ELABFTW_SERVER_NAME}"
      DISABLE_HTTPS: "false"
      AUTO_DB_UPDATE: "true"
      PHP_TIMEZONE: "${ELABFTW_TIMEZONE}"
    volumes:
      - /home/r730lab/smartlab-v3/.local/elabftw/uploads:/elabftw/uploads
